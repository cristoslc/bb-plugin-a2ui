# Operator-assisted E2E: a media description names the element where the Basic
# Catalog defines it. An Image carries it as alt and an AudioPlayer as
# aria-label. The catalog does not define description on Video, so a Video
# description is ignored and the element carries no aria-label. An element with
# no description gets no empty label either.
#
# The stream still sends "Harbor walkthrough" on the clip on purpose: the
# renderer drops it because the vendored catalog has no such property, and the
# validator reports UNKNOWN_PROPERTY for it. Every media URL is aborted by the
# runner before it leaves the machine, and the `external` list names each one.
#
# Run: npm run uat -- tests/manual/a2ui/uat-a11y-description.yaml
suite: a2ui-a11y-description
defaults:
  theme: dark
external:
  - https://example.com/media/harbor-dawn.png
  - https://example.com/media/harbor-notes.mp3
  - https://example.com/media/unlabelled-notes.mp3
  - https://example.com/media/harbor-clip.mp4
  - https://example.com/media/unlabelled-clip.mp4
  - https://example.com/media/harbor-poster.jpg
stream: |
  {"version":"1.0","createSurface":{"surfaceId":"harbor","sendDataModel":false}}
  {"version":"1.0","updateComponents":{"surfaceId":"harbor","components":[{"id":"root","component":"Card","child":"body"},{"id":"body","component":"Column","children":["title","photo","notes","looseNotes","clip","looseClip"]},{"id":"title","component":"Text","text":"Harbor media"},{"id":"photo","component":"Image","url":"https://example.com/media/harbor-dawn.png","description":"Harbor at dawn"},{"id":"notes","component":"AudioPlayer","url":"https://example.com/media/harbor-notes.mp3","description":"Notes recorded at the harbor"},{"id":"looseNotes","component":"AudioPlayer","url":"https://example.com/media/unlabelled-notes.mp3"},{"id":"clip","component":"Video","url":"https://example.com/media/harbor-clip.mp4","posterUrl":"https://example.com/media/harbor-poster.jpg","description":"Harbor walkthrough"},{"id":"looseClip","component":"Video","url":"https://example.com/media/unlabelled-clip.mp4"}]}}

steps:
  - id: description-names-image-and-audio
    title: Image exposes its description as alt and AudioPlayer exposes its description as aria-label
    goto: "?status=closed"
    assert:
      - count: { selector: img, equals: 1 }
      - attr: { selector: img, name: alt, equals: "Harbor at dawn" }
      - attr:
          selector: 'audio[src="https://example.com/media/harbor-notes.mp3"]'
          name: aria-label
          equals: "Notes recorded at the harbor"

  - id: video-description-is-not-a-name
    title: A Video description is ignored because the catalog does not define it, and no empty label is left behind
    goto: "?status=closed"
    assert:
      - count: { selector: audio, equals: 2 }
      - count: { selector: 'audio[aria-label]', equals: 1 }
      - count: { selector: 'audio[aria-label=""]', equals: 0 }
      - count: { selector: video, equals: 2 }
      - count: { selector: 'video[aria-label]', equals: 0 }
      - count: { selector: 'video[aria-label=""]', equals: 0 }
      - count: { selector: '[aria-label=""]', equals: 0 }
