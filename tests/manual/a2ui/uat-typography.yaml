# Operator-assisted E2E: a caption Text is visibly smaller than a body Text in
# the same row, measured from computed font size rather than from a class name.
#
# The Row holds exactly the two Text wrappers, so nth-child picks one each and
# `style` fails loudly if a selector ever matches more than one node.
#
# Run: npm run uat -- tests/manual/a2ui/uat-typography.yaml
suite: a2ui-typography
defaults:
  theme: dark
stream: |
  {"version":"1.0","createSurface":{"surfaceId":"weather","sendDataModel":false}}
  {"version":"1.0","updateComponents":{"surfaceId":"weather","components":[{"id":"root","component":"Card","child":"body"},{"id":"body","component":"Column","children":["title","row"]},{"id":"title","component":"Text","text":"Harbor weather"},{"id":"row","component":"Row","align":"center","children":["headline","stamp"]},{"id":"headline","component":"Text","text":"Mild with a light breeze"},{"id":"stamp","component":"Text","variant":"caption","text":"Updated this morning"}]}}

steps:
  - id: caption-is-smaller-than-body
    title: The caption Text computes 12px while the body Text beside it computes 13px
    goto: "?status=closed"
    assert:
      - count: { selector: 'div.flex-row > div.min-w-0:nth-child(1)', equals: 1 }
      - count: { selector: 'div.flex-row > div.min-w-0:nth-child(2)', equals: 1 }
      - style:
          selector: 'div.flex-row > div.min-w-0:nth-child(1)'
          property: font-size
          equals: 13px
      - style:
          selector: 'div.flex-row > div.min-w-0:nth-child(2)'
          property: font-size
          equals: 12px
      - text: "Mild with a light breeze"
      - text: "Updated this morning"
