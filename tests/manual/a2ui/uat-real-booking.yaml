# Operator-assisted E2E: a realistic booking form with three fields, a
# required check and an email check, one failed submit, the corrected values,
# and a successful submit whose exact message reaches the composer.
#
# Every field is typed with real keystrokes and every submit is a real mouse
# click at the button's own box.
#
# Run: npm run uat -- tests/manual/a2ui/uat-real-booking.yaml
suite: a2ui-real-booking
defaults:
  theme: dark
stream: |
  {"version":"1.0","createSurface":{"surfaceId":"booking","sendDataModel":true,"dataModel":{"name":"","email":"","notes":""}}}
  {"version":"1.0","updateComponents":{"surfaceId":"booking","components":[{"id":"root","component":"Card","child":"body"},{"id":"body","component":"Column","children":["title","name","email","notes","sendLabel","send"]},{"id":"title","component":"Text","text":"Book a room at the Harbor Hotel"},{"id":"name","component":"TextField","label":"Full name","placeholder":"Ada Lovelace","value":{"@path":"/name"},"@checks":[{"condition":{"@call":"required","args":{"value":{"@path":"/name"}}},"message":"Full name is required."}]},{"id":"email","component":"TextField","label":"Email","placeholder":"you@example.com","value":{"@path":"/email"},"@checks":[{"condition":{"@call":"email","args":{"value":{"@path":"/email"}}},"message":"Enter a working email address."}]},{"id":"notes","component":"TextField","label":"Notes","variant":"longText","placeholder":"Anything we should know","value":{"@path":"/notes"}},{"id":"sendLabel","component":"Text","text":"Request this room"},{"id":"send","component":"Button","variant":"primary","child":"sendLabel","@checks":[{"condition":{"@call":"required","args":{"value":{"@path":"/name"}}},"message":"Fix the highlighted fields before sending."}],"action":{"event":{"name":"bookRoom","userMessage":"Book the room","context":{"name":{"@path":"/name"},"email":{"@path":"/email"},"notes":{"@path":"/notes"}}}}}]}}

steps:
  - id: empty-booking-form-is-refused
    title: Submitting the empty form shows both checks and sends nothing
    goto: "?status=closed"
    actions:
      - click: { text: "Request this room" }
    assert:
      - text: "Full name is required."
      - text: "Enter a working email address."
      - button_blocked:
          label: Request this room
          message: Fix the highlighted fields before sending.
      - composer_empty: true

  - id: corrected-booking-form-sends-the-exact-message
    title: Typing valid values clears both checks and sends the exact booking message
    goto: "?status=closed"
    actions:
      - type: { label: Full name, text: "Ada Lovelace" }
      - type: { label: Email, text: "ada@example.com" }
      - type: { label: Notes, text: "Late arrival, quiet room" }
      - click: { text: "Request this room" }
    assert:
      - input_value: { label: Full name, value: "Ada Lovelace" }
      - input_value: { label: Email, value: "ada@example.com" }
      - input_value: { label: Notes, value: "Late arrival, quiet room" }
      - text_not: "Full name is required."
      - text_not: "Enter a working email address."
      - composer_exact: |-
          [a2ui action] bookRoom (surface booking)

          Book the room

          context:
          ```json
          {
            "name": "Ada Lovelace",
            "email": "ada@example.com",
            "notes": "Late arrival, quiet room"
          }
          ```

          data model:
          ```json
          {
            "name": "Ada Lovelace",
            "email": "ada@example.com",
            "notes": "Late arrival, quiet room"
          }
          ```
