# Operator-assisted E2E: a Video draws a real video element with the stream's
# src, the posterUrl as its poster attribute, and native controls.
#
# The runner aborts the media request before it leaves the machine; the
# `external` list names the two URLs the element asks for.
#
# Run: npm run uat -- tests/manual/a2ui/uat-video.yaml
suite: a2ui-video
defaults:
  theme: dark
external:
  - https://example.com/media/harbor-clip.mp4
  - https://example.com/media/harbor-poster.jpg
stream: |
  {"version":"1.0","createSurface":{"surfaceId":"reel","sendDataModel":false}}
  {"version":"1.0","updateComponents":{"surfaceId":"reel","components":[{"id":"root","component":"Card","child":"body"},{"id":"body","component":"Column","children":["title","clip"]},{"id":"title","component":"Text","text":"Harbor walkthrough"},{"id":"clip","component":"Video","url":"https://example.com/media/harbor-clip.mp4","posterUrl":"https://example.com/media/harbor-poster.jpg"}]}}

steps:
  - id: video-draws-src-poster-and-controls
    title: The video element carries its exact src and poster and shows native controls
    goto: "?status=closed"
    assert:
      - count: { selector: video, equals: 1 }
      - attr: { selector: video, name: src, equals: "https://example.com/media/harbor-clip.mp4" }
      - attr: { selector: video, name: poster, equals: "https://example.com/media/harbor-poster.jpg" }
      - attr: { selector: video, name: controls, equals: "" }
      - text: "Harbor walkthrough"
      - text_not: "This renderer only loads http and https videos."
