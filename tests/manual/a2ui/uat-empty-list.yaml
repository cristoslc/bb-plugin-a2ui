# Operator-assisted E2E: a List templated over an empty array draws zero rows
# and never shows the waiting text, while the rest of the surface still draws.
#
# Run: npm run uat -- tests/manual/a2ui/uat-empty-list.yaml
suite: a2ui-empty-list
defaults:
  theme: dark
stream: |
  {"version":"1.0","createSurface":{"surfaceId":"cart","dataModel":{"items":[]}}}
  {"version":"1.0","updateComponents":{"surfaceId":"cart","components":[{"id":"root","component":"Card","child":"body"},{"id":"body","component":"Column","children":["title","list","footer"]},{"id":"title","component":"Text","text":"Your cart is empty"},{"id":"list","component":"List","children":{"componentId":"row","path":"/items"}},{"id":"row","component":"Text","text":{"@path":"name"}},{"id":"footer","component":"Text","text":"Add an item to begin."}]}}

steps:
  - id: empty-array-draws-no-rows
    title: The empty template draws no row, shows no waiting text, and keeps the title and footer
    goto: "?status=closed"
    assert:
      - text: "Your cart is empty"
      - text: "Add an item to begin."
      - text_not: "Waiting for /items"
      - count: { selector: '.flex-col.gap-2 > .flex-col.gap-2 > div', equals: 0 }
      - count: { selector: '[data-uat-markdown]', equals: 2 }
      - text: "1 surface"
