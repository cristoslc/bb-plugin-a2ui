# Operator-assisted E2E: an AudioPlayer draws a real audio element with the
# stream's src and native controls.
#
# The runner aborts the media request before it leaves the machine; the
# `external` list names the URL the element asks for.
#
# Run: npm run uat -- tests/manual/a2ui/uat-audio.yaml
suite: a2ui-audio
defaults:
  theme: dark
external:
  - https://example.com/media/harbor-notes.mp3
stream: |
  {"version":"1.0","createSurface":{"surfaceId":"recording","sendDataModel":false}}
  {"version":"1.0","updateComponents":{"surfaceId":"recording","components":[{"id":"root","component":"Card","child":"body"},{"id":"body","component":"Column","children":["title","notes"]},{"id":"title","component":"Text","text":"Harbor audio notes"},{"id":"notes","component":"AudioPlayer","url":"https://example.com/media/harbor-notes.mp3","description":"Notes recorded at the harbor"}]}}

steps:
  - id: audio-draws-src-and-controls
    title: The audio element carries its exact src and shows native controls
    goto: "?status=closed"
    assert:
      - count: { selector: audio, equals: 1 }
      - attr: { selector: audio, name: src, equals: "https://example.com/media/harbor-notes.mp3" }
      - attr: { selector: audio, name: controls, equals: "" }
      - text: "Harbor audio notes"
      - text_not: "This renderer only loads http and https audio."
