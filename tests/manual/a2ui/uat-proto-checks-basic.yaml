# Operator-assisted E2E: the five single-value checks each fail on bad input,
# show their own message, and keep the button blocked with nothing sent.
#
# The button carries its own failing check so its aria-invalid state is set by
# the same rule a reader would hit. The click is a real mouse click at the
# button's own box, and the slider is moved with real keyboard events.
#
# Run: npm run uat -- tests/manual/a2ui/uat-proto-checks-basic.yaml
suite: a2ui-proto-checks-basic
defaults:
  theme: dark
stream: |
    {"version":"1.0","createSurface":{"surfaceId":"signup","sendDataModel":true,"dataModel":{"name":"","code":"abc","pin":"12","amount":2,"email":"not-an-email"}}}
    {"version":"1.0","updateComponents":{"surfaceId":"signup","components":[{"id":"root","component":"Card","child":"form"},{"id":"form","component":"Column","children":["name","code","pin","amount","email","send"]},{"id":"name","component":"TextField","label":"Name","placeholder":"Your name","value":{"@path":"/name"},"@checks":[{"condition":{"@call":"required","args":{"value":{"@path":"/name"}}},"message":"Name is required."}]},{"id":"code","component":"TextField","label":"Code","placeholder":"Three capital letters","value":{"@path":"/code"},"@checks":[{"condition":{"@call":"regex","args":{"value":{"@path":"/code"},"pattern":"^[A-Z]{3}$"}},"message":"Code must be three capital letters."}]},{"id":"pin","component":"TextField","label":"PIN","placeholder":"Four to six characters","value":{"@path":"/pin"},"@checks":[{"condition":{"@call":"length","args":{"value":{"@path":"/pin"},"min":4,"max":6}},"message":"PIN must be four to six characters."}]},{"id":"amount","component":"Slider","label":"Amount","min":0,"max":20,"value":{"@path":"/amount"},"@checks":[{"condition":{"@call":"numeric","args":{"value":{"@path":"/amount"},"min":5,"max":9}},"message":"Amount must be five to nine."}]},{"id":"email","component":"TextField","label":"Email","placeholder":"you@example.com","value":{"@path":"/email"},"@checks":[{"condition":{"@call":"email","args":{"value":{"@path":"/email"}}},"message":"Enter an email address."}]},{"id":"sendLabel","component":"Text","text":"Create account"},{"id":"send","component":"Button","variant":"primary","child":"sendLabel","@checks":[{"condition":{"@call":"required","args":{"value":{"@path":"/name"}}},"message":"Fix the highlighted fields before sending."}],"action":{"event":{"name":"createAccount","context":{"name":{"@path":"/name"}}}}}]}}

steps:
  - id: each-failing-check-shows-its-message
    title: Every failing single-value check shows its message and blocks the send
    goto: "?status=closed"
    actions:
      - click: { text: "Create account" }
    assert:
      - text: "Name is required."
      - text: "Code must be three capital letters."
      - text: "PIN must be four to six characters."
      - text: "Amount must be five to nine."
      - text: "Enter an email address."
      - button_blocked:
          label: Create account
          message: Fix the highlighted fields before sending.
      - composer_empty: true

  - id: satisfying-one-check-clears-only-its-message
    title: Moving the slider into range clears the numeric message and still blocks
    goto: "?status=closed"
    actions:
      - slider_to: { label: Amount, value: 7 }
      - click: { text: "Create account" }
    assert:
      - text_not: "Amount must be five to nine."
      - slider_value: { label: Amount, value: 7 }
      - text: "Name is required."
      - button_blocked:
          label: Create account
          message: Fix the highlighted fields before sending.
      - composer_empty: true
