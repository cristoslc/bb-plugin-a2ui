# Operator-assisted E2E: a static A2UI surface draws in both themes.
#
# Rendered and driven for real: the harness mounts the actual app.tsx against
# the mocked SDK (scripts/screenshot), and the assertions read the page the
# browser painted.
#
# Run: npm run uat -- tests/manual/a2ui/uat-draw.yaml
suite: a2ui-draw
defaults:
  theme: dark
stream: |
  {"version":"1.0","createSurface":{"surfaceId":"review","sendDataModel":false}}
  {"version":"1.0","updateComponents":{"surfaceId":"review","components":[{"id":"root","component":"Card","child":"body"},{"id":"body","component":"Column","children":["title","summary","rule","metrics"]},{"id":"title","component":"Text","text":"Quarterly review"},{"id":"summary","component":"Text","variant":"caption","text":"Revenue grew 12 percent while churn held flat."},{"id":"rule","component":"Divider","axis":"horizontal"},{"id":"metrics","component":"Row","justify":"spaceBetween","children":["north","europe"]},{"id":"north","component":"Text","text":"North America: 48 percent"},{"id":"europe","component":"Text","text":"Europe: 31 percent"}]}}

steps:
  - id: light-draws-the-static-surface
    title: A static surface draws its text under the light token set
    theme: light
    goto: "?status=closed"
    assert:
      - text: "Quarterly review"
      - text: "Revenue grew 12 percent while churn held flat."
      - text: "North America: 48 percent"
      - text: "1 surface"
      - theme: { expected: light }

  - id: dark-keeps-the-same-surface
    title: The same surface keeps its text under the dark token set
    goto: "?status=closed"
    assert:
      - text: "Quarterly review"
      - text: "Europe: 31 percent"
      - text: "1 surface"
      - theme: { expected: dark }
