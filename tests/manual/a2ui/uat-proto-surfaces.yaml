# Operator-assisted E2E: one reply can carry more than one surface, and the
# header counts them.
#
# Run: npm run uat -- tests/manual/a2ui/uat-proto-surfaces.yaml
suite: a2ui-proto-surfaces
defaults:
  theme: dark
stream: |
    {"version":"1.0","createSurface":{"surfaceId":"weather"}}
    {"version":"1.0","updateComponents":{"surfaceId":"weather","components":[{"id":"root","component":"Text","text":"Weather in Lisbon"}]}}
    {"version":"1.0","createSurface":{"surfaceId":"packing"}}
    {"version":"1.0","updateComponents":{"surfaceId":"packing","components":[{"id":"root","component":"Text","text":"Packing list for Porto"}]}}

steps:
  - id: two-surfaces-draw-side-by-side
    title: A reply with two surfaces draws both texts and counts two surfaces
    goto: "?status=closed"
    assert:
      - text: "Weather in Lisbon"
      - text: "Packing list for Porto"
      - text: "2 surfaces"
      - text_not: "1 surface"
      - text_not: "no surface"
