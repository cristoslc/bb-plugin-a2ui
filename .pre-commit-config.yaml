# Leak gate: gitleaks rejects hardcoded secrets before they enter history.
# Pin the revision and bump it deliberately.
minimum_pre_commit_version: "3.0.0"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Scan for hardcoded secrets
